<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marks & Results | SMS</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><span class="college-short">SGDTPC</span><span class="college-full">Student Management</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span> Students</a>
        <a href="courses.html" class="nav-item"><span class="nav-icon">📚</span> Courses</a>
        <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
        <a href="marks.html" class="nav-item active"><span class="nav-icon">📝</span> Marks & Results</a>
        <a href="fees.html" class="nav-item"><span class="nav-icon">💰</span> Fee Management</a>
        <a href="faculty.html" class="nav-item"><span class="nav-icon">👩‍🏫</span> Faculty</a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      </nav>
      <div class="sidebar-footer"><button onclick="logout()" class="btn-logout">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="hamburger" onclick="toggleSidebar()">☰</button><h2>Marks & Results</h2></div>
        <div class="topbar-right"><span id="userDisplay" class="user-badge"></span></div>
      </header>
      <div class="page-body">
        <div class="page-actions">
          <div class="filter-group">
            <select id="markBranch" onchange="loadMarkStudents()">
              <option value="">Select Branch</option>
              <option>Civil Engineering</option><option>Mechanical Engineering</option>
              <option>Electrical Engineering</option><option>Computer Engineering</option>
              <option>Electronics & Telecom</option>
            </select>
            <select id="markYear" onchange="loadMarkStudents()">
              <option value="">Select Year</option>
              <option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option>
            </select>
            <select id="markSemester">
              <option value="1">Semester 1</option><option value="2">Semester 2</option>
              <option value="3">Semester 3</option><option value="4">Semester 4</option>
              <option value="5">Semester 5</option><option value="6">Semester 6</option>
            </select>
          </div>
          <button class="btn-primary" onclick="openMarksModal()">+ Add Marks</button>
        </div>

        <div class="card">
          <table class="data-table">
            <thead><tr><th>Roll No</th><th>Student Name</th><th>Branch</th><th>Semester</th><th>Total Marks</th><th>Obtained</th><th>Percentage</th><th>Grade</th><th>Result</th><th>Actions</th></tr></thead>
            <tbody id="marksTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Marks Modal -->
  <div id="marksModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header"><h3>Enter Marks</h3><button class="modal-close" onclick="closeMarksModal()">✕</button></div>
      <form id="marksForm" class="modal-form">
        <input type="hidden" id="marksId"/>
        <div class="form-row">
          <div class="form-group"><label>Student (Roll No)</label>
            <select id="marksStudent" required><option value="">Select Student</option></select>
          </div>
          <div class="form-group"><label>Semester</label>
            <select id="marksSem">
              <option value="1">Sem 1</option><option value="2">Sem 2</option><option value="3">Sem 3</option>
              <option value="4">Sem 4</option><option value="5">Sem 5</option><option value="6">Sem 6</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Total Marks</label><input type="number" id="marksTotal" value="600" min="0"/></div>
          <div class="form-group"><label>Marks Obtained</label><input type="number" id="marksObtained" min="0" oninput="calcGrade()"/></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Percentage</label><input type="text" id="marksPct" readonly/></div>
          <div class="form-group"><label>Grade</label><input type="text" id="marksGrade" readonly/></div>
        </div>
        <div class="form-group"><label>Result</label>
          <select id="marksResult"><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="Detained">Detained</option></select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeMarksModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Marks</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/marks.js"></script>
</body>
</html>
