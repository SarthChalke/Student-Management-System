<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faculty | SMS</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><span class="college-short">SGDTPC</span><span class="college-full">Student Management</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span> Students</a>
        <a href="courses.html" class="nav-item"><span class="nav-icon">📚</span> Courses</a>
        <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
        <a href="marks.html" class="nav-item"><span class="nav-icon">📝</span> Marks & Results</a>
        <a href="fees.html" class="nav-item"><span class="nav-icon">💰</span> Fee Management</a>
        <a href="faculty.html" class="nav-item active"><span class="nav-icon">👩‍🏫</span> Faculty</a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      </nav>
      <div class="sidebar-footer"><button onclick="logout()" class="btn-logout">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="hamburger" onclick="toggleSidebar()">☰</button><h2>Faculty Management</h2></div>
        <div class="topbar-right"><span id="userDisplay" class="user-badge"></span></div>
      </header>
      <div class="page-body">
        <div class="page-actions">
          <div class="search-bar"><input type="text" id="facultySearch" placeholder="Search faculty..." oninput="filterFaculty()"/></div>
          <button class="btn-primary" onclick="openFacultyModal()">+ Add Faculty</button>
        </div>
        <div class="card">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Contact</th><th>Email</th><th>Qualification</th><th>Actions</th></tr></thead>
            <tbody id="facultyTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="facultyModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header"><h3 id="facultyModalTitle">Add Faculty</h3><button class="modal-close" onclick="closeFacultyModal()">✕</button></div>
      <form id="facultyForm" class="modal-form">
        <input type="hidden" id="facultyId"/>
        <div class="form-row">
          <div class="form-group"><label>Full Name *</label><input type="text" id="fName" required/></div>
          <div class="form-group"><label>Employee ID *</label><input type="text" id="fEmpId" required/></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Department</label>
            <select id="fDept">
              <option>Civil Engineering</option><option>Mechanical Engineering</option>
              <option>Electrical Engineering</option><option>Computer Engineering</option>
              <option>Electronics & Telecom</option><option>Applied Science</option>
            </select>
          </div>
          <div class="form-group"><label>Designation</label>
            <select id="fDesig">
              <option>Principal</option><option>HOD</option><option>Lecturer</option>
              <option>Senior Lecturer</option><option>Lab Assistant</option><option>Workshop Instructor</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Qualification</label><input type="text" id="fQual" placeholder="e.g. M.Tech, B.E."/></div>
          <div class="form-group"><label>Experience (Years)</label><input type="number" id="fExp" min="0"/></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Contact</label><input type="tel" id="fContact"/></div>
          <div class="form-group"><label>Email</label><input type="email" id="fEmail"/></div>
        </div>
        <div class="form-group"><label>Address</label><textarea id="fAddress" rows="2"></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeFacultyModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Faculty</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/faculty.js"></script>
</body>
</html>
