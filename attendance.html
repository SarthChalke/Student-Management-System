<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance | SMS</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><span class="college-short">SGDTPC</span><span class="college-full">Student Management</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span> Students</a>
        <a href="courses.html" class="nav-item"><span class="nav-icon">📚</span> Courses</a>
        <a href="attendance.html" class="nav-item active"><span class="nav-icon">📋</span> Attendance</a>
        <a href="marks.html" class="nav-item"><span class="nav-icon">📝</span> Marks & Results</a>
        <a href="fees.html" class="nav-item"><span class="nav-icon">💰</span> Fee Management</a>
        <a href="faculty.html" class="nav-item"><span class="nav-icon">👩‍🏫</span> Faculty</a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      </nav>
      <div class="sidebar-footer"><button onclick="logout()" class="btn-logout">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="hamburger" onclick="toggleSidebar()">☰</button><h2>Attendance Management</h2></div>
        <div class="topbar-right"><span id="userDisplay" class="user-badge"></span></div>
      </header>
      <div class="page-body">
        <div class="card">
          <div class="card-header"><h3>Mark Attendance</h3></div>
          <div class="form-row" style="padding:16px;">
            <div class="form-group">
              <label>Branch</label>
              <select id="attBranch" onchange="loadAttStudents()">
                <option value="">Select Branch</option>
                <option>Civil Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Electrical Engineering</option>
                <option>Computer Engineering</option>
                <option>Electronics & Telecom</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year</label>
              <select id="attYear" onchange="loadAttStudents()">
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="attDate"/>
            </div>
            <div class="form-group">
              <label>Subject</label>
              <input type="text" id="attSubject" placeholder="Subject name"/>
            </div>
          </div>
          <div id="attendanceList" style="padding:0 16px 16px;"></div>
          <div style="padding:0 16px 16px;">
            <button class="btn-primary" onclick="saveAttendance()">Save Attendance</button>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-header"><h3>Attendance Records</h3></div>
          <table class="data-table">
            <thead><tr><th>Date</th><th>Branch</th><th>Year</th><th>Subject</th><th>Present</th><th>Absent</th><th>Total</th></tr></thead>
            <tbody id="attRecords"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/attendance.js"></script>
</body>
</html>
